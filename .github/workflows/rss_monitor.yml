name: RSS Feed Monitor

on:
  schedule:
    # Runs every 5 minutes (fastest GitHub schedule)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab


permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS Feed Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACCOUNTS: ${{ secrets.ACCOUNTS || 'sunnewstamil,News18TamilNadu,polimernews,NewsTamilTV24x7' }}
        run: python main.py

      - name: Commit and push updated posted_tweets.json cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f posted_tweets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update posted_tweets.json cache" && git push)
